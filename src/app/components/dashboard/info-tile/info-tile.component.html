<mat-card class="card">
    <div class="tile-container">
        <div class="tile-container-title">
            <mat-icon class="icon">{{tileInfo.icon}}</mat-icon>
            <div class="tile-content">
                <div class="title">{{tileInfo.title}}</div>
                <div class="content"> {{tileInfo.value | tileValue}}</div>
            </div>
        </div>
    </div>
</mat-card>
